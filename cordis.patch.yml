# 挂载声明：DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把本插件插入
# 目标 profile 的配置树。
#
# 安装方式（本地开发，不发布到 npm）：
#   $env:DSH_HOME = 'D:\DSH\lab-web'
#   dsh plugin --profile web add link:D:\DSH\dsh-逆向\dsh-version-badge-own
#
# 宿主端（lib/index.js，普通 Cordis 插件）负责读出 DSH 的真实运行版本，
# 并通过 webserver 的 index 注入通道交给浏览器；
# `package.json` 里的 dsh.client 声明让 web app 额外加载 ./client（浏览器半边）。
